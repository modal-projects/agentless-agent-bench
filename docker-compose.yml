# Warm pool for the benchmark: one long-lived container per task (x $WARM_EACH replicas),
# stood up/torn down via `uv run main.py warm [--each N] [--down]`.
name: agentless-bench

x-defaults: &defaults
  pull_policy: never          # only locally built images, never a registry
  # PID 1 must survive the reset's in-container kill-all (namespace init is
  # immune) AND reap the corpses of daemons solve.sh leaves behind, else
  # zombies pile up across iterations — hence a reaping loop, not bare sleep.
  command: ["sh", "-c", "while :; do sleep 2073600 & wait; done"]
  stop_signal: SIGKILL        # PID-1 sh ignores TERM; keeps `down` fast
  network_mode: none
  deploy:
    replicas: ${WARM_EACH:-1}

services:
  break-filter-js-from-html:
    <<: *defaults
    image: local/break-filter-js-from-html
    mem_limit: 2048m
    volumes: ["./tasks/break-filter-js-from-html:/solution:ro"]
